appId: ai.zpaper.app
productName: zpaper
directories:
  output: release
files:
  - dist/**
  - package.json
asar: true
asarUnpack:
  - node_modules/@superdoc-dev/sdk-*/**
mac:
  category: public.app-category.productivity
  identity: null
  target:
    - target: dmg
      arch: [arm64, x64]
win:
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
